{% extends "page.html" %}

{% block content -%}
<h1>Search the archive</h1>
<form id="search" role="search" action="{{ path }}"{% if has_local_transcripts %} data-media-search{% endif %}>
<div class="search-options">
  <div>
    <label for="search-scope">Search in</label>
    <select id="search-scope" name="scope">
      <option value="text" selected>Full text</option>
      {% if has_transcripts %}<option value="article">Article and event text</option>{% endif %}
      <option value="titles">Article titles</option>
      {% if has_transcripts -%}
      <option value="podcast">Podcasts</option>
      <option value="video">Videos</option>
      {%- endif %}
    </select>
  </div>
  <div>
    <label for="search-language">Language</label>
    <select id="search-language">
      {% for language, href in search_pages.items() -%}
      <option value="{{ language }}" data-path="{{ href }}"{% if language == lang %} selected{% endif %}>{{ language | upper }}</option>
      {% endfor -%}
    </select>
  </div>
</div>
<label for="query">Search terms</label>
<div class="search-input"><input type="search" id="query" name="q">
<button type="submit">Search</button></div>
<fieldset id="search-filters" hidden>
  <legend>Filter articles</legend>
  {% for name, label, options in filter_options -%}
  <label for="search-{{ name }}">{{ label }}
    <select id="search-{{ name }}" name="{{ name }}">
      <option value="">All</option>
      {% for value, text in options -%}
      <option value="{{ value }}">{{ text }}</option>
      {% endfor -%}
    </select>
  </label>
  {% endfor -%}
</fieldset>
</form>
<p id="search-status" role="status"></p>
<ol id="search-results" class="records" aria-label="Search results"></ol>
<noscript><p>Enable JavaScript to search the archive.</p></noscript>
{% endblock %}
